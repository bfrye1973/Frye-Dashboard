name: Frontend Minor W2 Complete / W3 Research
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22MinorW2CompleteW3Nov9.test.jsx'
      - '.github/workflows/engine22-minor-w2-complete-w3-nov9.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MinorW2CompleteW3Nov9.test.jsx
      - run: npm run build
