name: Engine 2B Frontend Build
on:
  push:
    branches: [engine2b-chart-overlays-v1]
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/**'
      - '.github/workflows/engine2b-frontend-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build feature-gated chart
        run: npm run build
        env:
          REACT_APP_ENGINE2B_OVERLAY_V1: 'true'
          CI: 'false'

      - name: Wave/Fib lifecycle regression tests
        run: npm test -- --watchAll=false --runInBand --testPathPattern=WaveFibOverlay.test.js
        env:
          CI: 'true'
