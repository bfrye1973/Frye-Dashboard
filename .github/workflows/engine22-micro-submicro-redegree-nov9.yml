name: Frontend Micro Submicro Nov9 Redegree
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22MicroSubmicroRedegreeNov9.test.jsx'
      - '.github/workflows/engine22-micro-submicro-redegree-nov9.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MicroSubmicroRedegreeNov9.test.jsx src/pages/rows/RowChart/overlays/Engine22SubmicroW3Nov9Research.test.jsx
      - run: npm run build
