name: Engine22 Seven-Degree Card Draft Build
on:
  push:
    branches:
      - engine22-seven-degree-fib-display-fix-20261014
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowStrategies/index.jsx'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
