name: Engine2 Submicro Latest Sheet Nodes
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/rows/RowChart/intermediateMinorReview.js'
      - 'src/pages/rows/RowChart/intermediateMinorReview.test.js'
      - 'src/pages/rows/RowChart/overlays/OwnerWaveAnchorsOverlay.jsx'
      - '.github/workflows/engine2-submicro-latest-sheet.yml'
jobs:
  submicro-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify actual Submicro owner sheet rows and source candle gate
        run: CI=true npm test -- --watch=false --runInBand --testPathPattern=intermediateMinorReview.test.js
      - name: Build existing chart without deployment
        run: npm run build
