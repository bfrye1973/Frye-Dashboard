name: Engine25 Distribution hierarchy comparison gate

on:
  push:
    branches:
      - engine25-distribution-hierarchy-comparisons

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build
      - name: Contract checks
        run: |
          grep -q '4H STRUCTURE:' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q '1H TREND:' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q '30m CONFIRMATION:' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q 'PRIOR COMPARISON' src/pages/engine25/Engine25MarketXrayPreview.jsx
