name: Engine22C wave intelligence UI validation

on:
  push:
    branches:
      - engine22c-current-wavelength-ui-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine22c-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine22c-ui:
    if: github.ref == 'refs/heads/engine22c-current-wavelength-ui-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Engine22C UI branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend build
        env:
          CI: 'true'
        run: npm run build
