name: Engine22 Owner Recount V8 Cards
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22OwnerRecountV8Cards.test.jsx'
      - '.github/workflows/engine22-owner-recount-v8-cards.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/rows/RowChart/overlays/Engine22OwnerRecountV8Cards.test.jsx
      - run: npm run build
