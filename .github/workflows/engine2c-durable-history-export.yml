name: Engine2C private historical pages refresh
on:
  push:
    branches: [main, engine2c-durable-history-export-20261031]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  refresh-verified-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate separately verified October30 page archive ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "/repos/bfrye1973/Frye-Dashboard/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "engine2c-oct30-private-history-pages" and .expired == false)) | sort_by(.created_at) | last | .id')
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "EXACT_OCT30_SOURCE_ARTIFACT_MISSING - refuse fallback to old pages"
            exit 1
          fi
          echo "ENGINE2C_OCT30_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
      - name: Retrieve verified October30 pages into private temporary directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine2c-history/pages
          gh api "/repos/bfrye1973/Frye-Dashboard/actions/artifacts/${ENGINE2C_OCT30_ARTIFACT_ID}/zip" > /tmp/engine2c-history/pages.zip
          unzip -q /tmp/engine2c-history/pages.zip -d /tmp/engine2c-history/pages
          if [ -d /tmp/engine2c-history/pages/pages/continuousRaw ]; then
            mv /tmp/engine2c-history/pages/pages/* /tmp/engine2c-history/pages/
            rmdir /tmp/engine2c-history/pages/pages
          fi
      - name: Verify exact pinned October30 dataset and all 498 page hashes
        run: |
          set -euo pipefail
          node research/engine2c-preview/verify-history-export.mjs /tmp/engine2c-history/pages
      - name: Publish verified October30 pages as existing private artifact contract
        uses: actions/upload-artifact@v4
        with:
          name: engine2c-historical-pages-private
          path: /tmp/engine2c-history/pages/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
      - name: Destroy private source workspace
        if: always()
        run: rm -rf /tmp/engine2c-history
