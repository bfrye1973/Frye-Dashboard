name: Engine 8D Manual PAPER Dashboard
on:
  push:
    branches: [engine8d-seven-manual-paper-dashboard-v1]
  pull_request:
    paths:
      - "src/pages/ManualPaperAccounts.jsx"
      - "src/App.js"
      - "src/components/RedlineAppShell.jsx"
      - ".github/workflows/engine8d-manual-paper-dashboard.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - name: Production JSX compile
        run: npm run build
