name: Seven REAL Journal Frontend Build
on:
  pull_request:
    paths:
      - "src/pages/JournalFull.jsx"
      - "src/pages/journal/components/JournalRealStrategySections.jsx"
      - ".github/workflows/seven-real-journal-frontend.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
