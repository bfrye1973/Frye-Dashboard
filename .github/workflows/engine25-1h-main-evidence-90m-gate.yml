name: Engine25 1H Main Evidence 90m Gate

on:
  push:
    branches:
      - engine25-1h-main-evidence-90m-v1

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-package-lock
      - run: DISABLE_ESLINT_PLUGIN=true npm run build
      - run: grep -q 'hourlyAgeMs <= 90 \* 60 \* 1000' src/pages/engine25/Engine25MarketXrayPreview.jsx
