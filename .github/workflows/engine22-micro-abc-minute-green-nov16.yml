name: Frontend Engine22 Micro ABC and Minute W2 Green Fib
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22MicroAbcMinuteFibGreenNov16.test.jsx'
      - '.github/workflows/engine22-micro-abc-minute-green-nov16.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MicroAbcMinuteFibGreenNov16.test.jsx src/pages/rows/RowChart/overlays/Engine22MicroSubmicroRedegreeNov9.test.jsx
      - run: npm run build
