name: Engine22 Owner Primary Intermediate Micro Cards
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22OwnerPrimaryIntermediateMicroNov23.test.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22Nov23ConsolidationContext.test.jsx'
      - '.github/workflows/engine22-owner-wave-card-projections.yml'
jobs:
  test-owner-wave-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/rows/RowChart/overlays/Engine22OwnerPrimaryIntermediateMicroNov23.test.jsx src/pages/rows/RowChart/overlays/Engine22Nov23ConsolidationContext.test.jsx
      - run: npm run build
