name: Engine2 Remove Legacy Micro Submicro Fallbacks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/rows/RowChart/index.jsx'
      - 'src/pages/rows/RowChart/IndicatorsToolbar.jsx'
      - 'src/pages/rows/RowChart/engine22WorkingNodeReader*'
      - 'src/pages/rows/RowChart/overlays/OwnerWaveAnchorsOverlay.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22FibLayersOverlay.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22ManualWaveStage.test.jsx'
      - '.github/workflows/engine2-remove-legacy-micro-submicro.yml'
jobs:
  verify-engine22-only-nodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Engine22 current source only, no stale fallback
        run: CI=true npm test -- --watch=false --runInBand --testPathPattern=engine22WorkingNodeReader.test.js
      - name: Legacy Micro/Submicro manual Fib canvas cannot reintroduce dots or connectors
        run: CI=true npm test -- --watch=false --runInBand --testPathPattern=Engine22ManualWaveStage.test.jsx
      - name: Other seven-degree source data unaffected
        run: CI=true npm test -- --watch=false --runInBand --testPathPattern=intermediateMinorReview.test.js
      - name: Existing chart build without touching candle loading
        run: npm run build
