name: Engine25 Volume Imbalance Label Test

on:
  push:
    branches:
      - engine25-volume-imbalance-label-v1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-package-lock
      - run: DISABLE_ESLINT_PLUGIN=true npm run build
      - run: |
          grep -q 'Math.abs(imbalancePct).toFixed(1)' src/pages/engine25/Engine25MarketXrayPreview.jsx
