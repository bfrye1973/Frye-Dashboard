name: Engine25 Last Valid Equity UI Gate

on:
  push:
    branches:
      - engine25-distribution-last-valid-equity-ui

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-package-lock
      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build
      - name: Contract checks
        run: |
          grep -q 'LAST VALID EQUITY READ' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q 'EQUITY SESSION CLOSED' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q 'confirmation30m?.display' src/pages/engine25/Engine25MarketXrayPreview.jsx
          grep -q 'acceleration10m?.display' src/pages/engine25/Engine25MarketXrayPreview.jsx
