name: Engine22 Minute ABC Strategy Card
on:
  pull_request:
    paths:
      - "src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx"
      - "src/pages/rows/RowChart/overlays/Engine22MinuteAbcResearchNov5.test.jsx"
      - ".github/workflows/engine22-minute-abc-card.yml"
  push:
    branches: ["engine22-minute-abc-card-20261105"]
jobs:
  minute-abc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MinuteAbcResearchNov5.test.jsx
      - run: npm run build
