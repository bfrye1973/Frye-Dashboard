name: Engine29 source audit

on:
  push:
    branches:
      - engine29-move-v2-prod-verification
    paths:
      - .github/workflows/engine29-source-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live source routes
        shell: bash
        run: |
          node <<'NODE'
          const base="https://frye-market-backend-1.onrender.com";
          const tests=[
            ["CL","1h","/api/v1/futures/ohlc"],
            ["CL","30m","/api/v1/futures/ohlc"],
            ["BZ","1h","/api/v1/futures/ohlc"],
            ["BZ","30m","/api/v1/futures/ohlc"],
            ["I:TNX","1h","/api/v1/ohlc"],
            ["I:TNX","30m","/api/v1/ohlc"],
            ["I:TYX","1h","/api/v1/ohlc"],
            ["I:TYX","30m","/api/v1/ohlc"]
          ];
          for (const [symbol,tf,path] of tests){
            const u=new URL(path,base);
            u.searchParams.set("symbol",symbol);
            u.searchParams.set("timeframe",tf);
            u.searchParams.set("limit","20");
            try{
              const r=await fetch(u,{cache:"no-store"});
              const j=await r.json();
              const bars=Array.isArray(j)?j:(j?.bars||[]);
              const last=bars.at(-1)||null;
              console.log("SRC",JSON.stringify({symbol,tf,status:r.status,count:bars.length,resolvedSymbol:j?.resolvedSymbol||null,last}));
            }catch(e){
              console.log("SRC_ERR",JSON.stringify({symbol,tf,error:String(e)}));
            }
          }
          NODE
