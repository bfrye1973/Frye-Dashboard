name: Engine27 V6 Wave Learning Preview
on:
  push:
    branches: [engine27-v6-wave-learning-preview-20261028]
  pull_request:
    paths:
      - "src/pages/rows/RowStrategies/Engine27WaveLearningPreview.jsx"
      - "src/pages/rows/RowStrategies/index.jsx"
      - ".github/workflows/engine27-v6-wave-learning-preview.yml"
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build isolated dashboard UI
        run: npm run build
