name: Frontend Minute Subminute W1 Forming Nov9
on:
  pull_request:
    paths:
      - 'src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx'
      - 'src/pages/rows/RowChart/overlays/Engine22MinuteSubminuteW1FormingNov9.test.jsx'
      - '.github/workflows/engine22-minute-subminute-w1-forming-nov9.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MinuteSubminuteW1FormingNov9.test.jsx src/pages/rows/RowChart/overlays/Engine22MicroSubmicroRedegreeNov9.test.jsx
      - run: npm run build
