name: Engine2C RowChart Integration V1
on:
  push:
    branches: [engine2c-navigation-verification-20261016]
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/RowChartModeGate.jsx'
      - 'src/pages/FullChart.jsx'
      - 'src/pages/NewDashboard.jsx'
      - 'public/engine2c-research/**'
      - 'research/engine2c-preview/dashboard-integration-smoke.cjs'
      - '.github/workflows/engine2c-rowchart-integration.yml'
jobs:
  integrated-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify original chart was not changed
        run: |
          git diff --exit-code fe99cddfd7a219da484aa7a8413a76dd7f865d7a -- src/pages/rows/RowChart/index.jsx src/lib/ohlcClient.js || exit 1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build actual production frontend
        run: npm run build
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve built SPA on localhost only
        run: |
          node research/engine2c-preview/integration-http.cjs >/tmp/engine2c-integration-server.log 2>&1 &
      - name: Verify research static asset packaged in CRA build
        run: |
          test -s build/engine2c-research/index.html
          test -s build/engine2c-research/app.js
          test -s build/engine2c-research/fixture-pinned.js
      - name: Verify local preview server is ready
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8193/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engine2c-integration-server.log
          exit 1
      - name: Test integrated chart and reversible rollback
        run: node research/engine2c-preview/dashboard-integration-smoke.cjs
      - name: Archive integrated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine2c-integrated-dashboard-v1
          path: /tmp/engine2c-integrated-*.png
          if-no-files-found: ignore
  original-tab-authentic-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Retrieve already-verified private history package
        uses: actions/download-artifact@v4
        with:
          run-id: 41232217138
          name: engine2c-historical-pages-private
          path: /tmp/engine2c-verified-package/pages
          github-token: ${{ github.token }}
      - name: Build original Frye Dashboard with automatic Backend-1 history requests
        run: |
          npm ci
          npm run build
          test -s build/engine2c-research/app.js
      - name: Install Chromium browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve same original RESEARCH chart inside normal dashboard page
        run: |
          node research/engine2c-preview/integration-http.cjs >/tmp/engine2c-original-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8193/engine2c-research/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engine2c-original-http.log
          exit 1
      - name: Verify original chart automatically loads 1000 / 5000 / 25000 authentic ES bars
        env:
          ENGINE2C_PRIVATE_PAGES: /tmp/engine2c-verified-package/pages
        run: node research/engine2c-preview/original-tab-hosted-history-browser.cjs
      - name: Remove private data
        if: always()
        run: rm -rf /tmp/engine2c-verified-package

  full-navigation-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Retrieve pinned Engine11 historical pages
        uses: actions/download-artifact@v4
        with:
          run-id: 41232217138
          name: engine2c-historical-pages-private
          path: /tmp/engine2c-history/pages
          github-token: ${{ github.token }}
      - name: Build existing research chart and install Chromium
        run: |
          npm ci
          npm run build
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start existing dashboard test host
        run: |
          node research/engine2c-preview/integration-http.cjs >/tmp/engine2c-nav-http.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8193/engine2c-research/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/engine2c-nav-http.log
          exit 1
      - name: Verify all 21 collections and earliest-history navigation
        env:
          ENGINE2C_PRIVATE_PAGES: /tmp/engine2c-history/pages
        run: node research/engine2c-preview/verify-historical-navigation.cjs
