name: Engine22 Minor W2 Strategy Card
on:
  pull_request:
    paths:
      - "src/pages/rows/RowChart/overlays/Engine22MarketStructureCard.jsx"
      - "src/pages/rows/RowChart/overlays/Engine22MinorW2ResearchCard.test.jsx"
      - ".github/workflows/engine22-minor-w2-card.yml"
  push:
    branches:
      - "engine22-minor-w2-card-20261105"
jobs:
  minor-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: CI=true npm test -- --watchAll=false --runTestsByPath src/pages/rows/RowChart/overlays/Engine22MinorW2ResearchCard.test.jsx
      - run: npm run build
